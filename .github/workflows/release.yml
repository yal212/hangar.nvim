name: Release

# Pushing a vX.Y.Z tag publishes a GitHub release whose body is that version's
# CHANGELOG section. Cut a release with:
#   make check && git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # a tag that disagrees with M.version would ship a release whose notes and
      # :checkhealth version contradict each other — fail before publishing
      - name: Check tag against M.version and CHANGELOG
        run: scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Extract release notes
        run: |
          scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
